name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 린트 · 테스트 · 정적 점검 (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 개발 의존성 설치
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 단위 테스트
        run: npm test

      - name: manifest·참조 파일·문법 점검
        run: npm run check

  package:
    name: 패키지 빌드
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ZIP 패키지 생성
        run: npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: k-apply-extension
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
