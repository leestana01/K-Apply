name: 버그 제보
description: 자동 입력이 잘못되거나 동작하지 않는 문제를 알려 주세요.
title: "[버그] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        제보해 주셔서 감사합니다. **개인정보(이름, 연락처, 이메일, 이력서 내용 등)는 절대 올리지 마세요.** 스크린샷은 개인정보를 가린 뒤 첨부해 주세요.
  - type: dropdown
    id: platform
    attributes:
      label: 채용 솔루션
      options:
        - 그리팅
        - 나인하이어
        - 마이다스인
        - 기타 / 모름
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 공고 URL
      description: 로그인 없이 열 수 있는 공고 주소라면 재현에 큰 도움이 됩니다.
      placeholder: https://example.career.greetinghr.com/ko/o/000000
  - type: textarea
    id: what
    attributes:
      label: 어떤 문제가 있었나요?
      description: 기대한 동작과 실제 동작을 적어 주세요. 결과 토스트의 "확인 필요" 목록도 함께 적어 주세요.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 확장프로그램 / Chrome 버전
      placeholder: K-Apply 1.0.0 / Chrome 140
    validations:
      required: true
